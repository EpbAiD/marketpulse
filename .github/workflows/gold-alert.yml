name: Gold Dip Alert

# Runs once daily at 22:15 UTC — safely after US market close (21:00 UTC)
# so the day's closing price is available on Yahoo Finance.
on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email to all recipients (does not evaluate real dips)"
        type: boolean
        default: false

permissions:
  contents: write   # so the workflow can commit the updated state file

jobs:
  gold-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet yfinance pandas pyyaml

      - name: Run gold dip alert evaluator
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/gold_dip_alerts.py --test-email
          else
            python scripts/gold_dip_alerts.py
          fi

      - name: Commit updated state file
        if: always()
        run: |
          if [ -n "$(git status --porcelain outputs/alerts/gold_alert_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outputs/alerts/gold_alert_state.json
            git commit -m "gold alert: update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
