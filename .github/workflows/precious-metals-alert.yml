name: Precious Metals Basket Alert

# Runs once daily at 22:20 UTC — 5 minutes after the gold-only alert so the
# two are visibly independent in the Actions history. Independent workflow,
# independent state file, independent from gold_dip_alerts.py.
on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test basket-alert to all recipients"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  basket-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet yfinance pandas pyyaml

      - name: Run basket alert evaluator
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/precious_metals_basket_alerts.py --test-email
          else
            python scripts/precious_metals_basket_alerts.py
          fi

      - name: Commit updated state file
        if: always()
        run: |
          if [ -n "$(git status --porcelain outputs/alerts/pm_basket_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outputs/alerts/pm_basket_state.json
            git commit -m "pm basket alert: update state [skip ci]"
            git push
          else
            echo "No state changes."
          fi
