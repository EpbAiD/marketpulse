# Gold Dip Alert — Recipient List
# ----------------------------------
# Every entry below receives every alert this system fires.
# To add someone: append another entry under `recipients:` — no code change
# needed. Name is optional (used in the email greeting when present).
#
# Optional per-recipient `tiers` filter:
#   seasonal      — Jan-Feb -3% dip trigger (the primary "buy now" signal)
#   deadline      — Feb 28 reminder if the seasonal alert never fired
#   opportunistic — Mar-Dec -5% dip (out-of-season buying opportunity)
#   major         — -10% dip any time (quarter-conditional strong/warning)
#   predicted     — advance warning from MarketPulse forecast (1-5 days ahead)
# Omitting `tiers` means the recipient gets all five.
#
# Optional per-recipient `currency` (default USD). Supported:
#   USD  US Dollar
#   EUR  Euro
#   GBP  British Pound
#   INR  Indian Rupee
#   JPY  Japanese Yen
#   AUD  Australian Dollar
#   CAD  Canadian Dollar
#   CHF  Swiss Franc
#   CNY  Chinese Yuan
#   AED  UAE Dirham
#   SAR  Saudi Riyal
#   SGD  Singapore Dollar
#   HKD  Hong Kong Dollar
#   NZD  New Zealand Dollar
#   ZAR  South African Rand
#   BRL  Brazilian Real
#   MXN  Mexican Peso
#   TRY  Turkish Lira
# Live exchange rate fetched from Yahoo Finance at alert time.

recipients:
